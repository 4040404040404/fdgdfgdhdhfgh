          finale-host: ${{ env.FINALE_HOST }}

  # --------------------------------------------------------------------------
  # One-page report for the whole chain.
  # --------------------------------------------------------------------------
  chain-summary:
    name: '11 - Chain summary'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [prepare, site-01, site-02, site-03, site-04, site-05,
            site-06, site-07, site-08, site-09, site-10]
    if: always()
    steps:
      - name: Write job summary
        shell: bash
        run: |
          {
            echo "## Playwright chain - 10 sequential jobs"
            echo ""
            echo "Finale host: `${{ env.FINALE_HOST }}` | started from job `${{ needs.prepare.outputs.start-index }}`"
            echo ""
            echo "| # | Target URL | Job | Reached finale | Exit |"
            echo "|---|------------|-----|----------------|------|"
            echo "| 01 | zealous-river-220556.puter.site | ${{ needs.site-01.result }} | ${{ needs.site-01.outputs.reached-finale }} | ${{ needs.site-01.outputs.exit-code }} |"
            echo "| 02 | witty-snake-472744.puter.site | ${{ needs.site-02.result }} | ${{ needs.site-02.outputs.reached-finale }} | ${{ needs.site-02.outputs.exit-code }} |"
            echo "| 03 | kind-street-188208.puter.site | ${{ needs.site-03.result }} | ${{ needs.site-03.outputs.reached-finale }} | ${{ needs.site-03.outputs.exit-code }} |"
            echo "| 04 | honest-bee-81788.puter.site | ${{ needs.site-04.result }} | ${{ needs.site-04.outputs.reached-finale }} | ${{ needs.site-04.outputs.exit-code }} |"
            echo "| 05 | victorious-square-662213.puter.site | ${{ needs.site-05.result }} | ${{ needs.site-05.outputs.reached-finale }} | ${{ needs.site-05.outputs.exit-code }} |"
            echo "| 06 | relaxed-crab-648834.puter.site | ${{ needs.site-06.result }} | ${{ needs.site-06.outputs.reached-finale }} | ${{ needs.site-06.outputs.exit-code }} |"
            echo "| 07 | smart-mountain-937000.puter.site | ${{ needs.site-07.result }} | ${{ needs.site-07.outputs.reached-finale }} | ${{ needs.site-07.outputs.exit-code }} |"
            echo "| 08 | avid-mountain-909877.puter.site | ${{ needs.site-08.result }} | ${{ needs.site-08.outputs.reached-finale }} | ${{ needs.site-08.outputs.exit-code }} |"
            echo "| 09 | jolly-road-702644.puter.site | ${{ needs.site-09.result }} | ${{ needs.site-09.outputs.reached-finale }} | ${{ needs.site-09.outputs.exit-code }} |"
            echo "| 10 | colorful-tv-258268.puter.site | ${{ needs.site-10.result }} | ${{ needs.site-10.outputs.reached-finale }} | ${{ needs.site-10.outputs.exit-code }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # Optional continuous mode: re-dispatch this workflow after job 10.
  # For push / schedule events this stays off - the 30-minute cron drives the loop.
  # --------------------------------------------------------------------------
  restart-chain:
    name: '12 - Restart chain'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [prepare, chain-summary]
    if: always() && needs.prepare.outputs.restart == 'true'
    steps:
      - name: Re-trigger this workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WF_FILE=$(echo "$GITHUB_WORKFLOW_REF" | sed -E 's|.*/workflows/([^@]+)@.*|\1|')
          echo "Re-triggering $WF_FILE on ${{ github.ref_name }}"
          gh workflow run "$WF_FILE" \
            --ref "${{ github.ref_name }}" \
            -f start_from=1 \
            -f restart_after_chain=true
