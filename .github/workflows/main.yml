name: Playwright Continuous Automation

x-target-urls:
  default_target_url: &default_target_url 'https://zealous-river-220556.puter.site'
  stop_target_url: &stop_target_url 'https://colorful-tv-258268.puter.site'

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Starting website URL'
        required: false
        default: *default_target_url

  push:
    branches:
      - main
      - master

  schedule:
    - cron: '*/30 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: playwright-continuous-runner
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEFAULT_TARGET_URL: *default_target_url
      STOP_TARGET_URL: *stop_target_url

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium & system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Script (with Xvfb virtual display for headed mode)
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || env.DEFAULT_TARGET_URL }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" node run-finale.js "$TARGET_URL"

      - name: Trigger Next Job Automatically on Completion
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_URL: ${{ github.event.inputs.target_url || env.DEFAULT_TARGET_URL }}
        run: |
          WF_FILE=$(echo "$GITHUB_WORKFLOW_REF" | sed -E 's|.*/workflows/([^@]+)@.*|\1|')
          echo "Re-triggering $WF_FILE"
          gh workflow run "$WF_FILE" --ref "${{ github.ref_name }}" -f target_url="$TARGET_URL"
